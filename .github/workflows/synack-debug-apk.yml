name: SynAck SMS - Build Debug APK

# Build only when manually requested or app/build inputs change on master.
# Documentation, metadata, security-report and unrelated workflow changes do not trigger a build.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'presentation/**'
      - 'data/**'
      - 'domain/**'
      - 'common/**'
      - 'android-smsmms/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - '.github/workflows/synack-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: synack-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDK_MANAGER" ]]; then
            echo "::error::Android sdkmanager is not installed on the runner"
            exit 1
          fi
          "$SDK_MANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :presentation:assembleDebug --stacktrace --no-daemon

      - name: List produced APKs and checksums
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find presentation/build/outputs/apk/debug -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload APK for installation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SynAck-SMS-debug-APK
          path: presentation/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
