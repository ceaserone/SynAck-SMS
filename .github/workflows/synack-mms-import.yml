name: SynAck SMS - One-Time MMS Config Refresh

on:
  workflow_dispatch:
    inputs:
      refresh_mms_configs:
        description: 'Run ONE manual MMS config refresh from Google Messages and open a review PR?'
        required: true
        type: boolean
        default: false

concurrency:
  group: one-time-mms-configs
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ inputs.refresh_mms_configs == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      APKEEP_VERSION: 1.0.0
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-apkeep-${{ env.APKEEP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-apkeep-
      
      - name: Set Branch Name
        run: echo "NEW_BRANCH=update-mms-configs-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
      
      - name: Install apkeep
        shell: bash
        run: |
          set -euo pipefail
          if command -v apkeep >/dev/null 2>&1; then
            installed_version=$(apkeep --version | awk '{print $2}')
            if [[ "$installed_version" == "$APKEEP_VERSION" ]]; then
              echo "apkeep ${APKEEP_VERSION} already installed."
              exit 0
            fi
          fi
          cargo install apkeep --locked --version "$APKEEP_VERSION"
        
      - name: Install APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apktool unzip
          
      - name: Download Google-signed Messages APK to temporary runner folder (via mirror)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synack-mms-apk"
          # Google Play requires a private AAS authentication token.
          # Use APKPure as transport only; the Google signing certificate is pinned below.
          apkeep -d apk-pure -a com.google.android.apps.messaging "$RUNNER_TEMP/synack-mms-apk"
          find "$RUNNER_TEMP/synack-mms-apk" -maxdepth 2 -type f -printf '%p\n'

      - name: Extract MMS config resources (no APK checked into repo)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          download_dir="$RUNNER_TEMP/synack-mms-apk"
          for archive in "$download_dir"/*.xapk; do
            unzip -oq "$archive" -d "$download_dir/extracted"
          done
          # XAPK bundles contain split APKs (config.pt.apk etc.); select the base APK.
          apk=""
          while IFS= read -r -d '' candidate; do
            badge="$(aapt dump badging "$candidate" 2>/dev/null | sed -n '1p' || true)"
            if [[ "$badge" == *"name='com.google.android.apps.messaging'"* && "$badge" != *"split='"* ]]; then
              apk="$candidate"
              break
            fi
          done < <(find "$download_dir" -type f -name '*.apk' -print0)

          if [[ -z "$apk" ]]; then
            echo "::error::Could not locate base Google Messages APK (only splits found)"
            find "$download_dir" -type f -maxdepth 3 -print
            exit 1
          fi
          echo "Selected base APK: $apk"

          # APKPure is a mirror, so verify both package identity and Google signing key.
          # Both Google Messages certificate variants are independently listed by APKMirror.
          expected_cert="cc75526d6c0f80ac3b3a84eb44838440dbbe6b124443a7c7d7bd19182ac022c9"
          expected_cert_alt="e8d0ae7cc3c4e0f3be9a8dd9a50667b3eaa54b4333b9bbb35a4151a7988ee26b"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$signer" ]]; then
            echo "::error::Missing Android apksigner; refusing unverified import"
            exit 1
          fi
          badge="$(aapt dump badging "$apk" | sed -n '1p')"
          if [[ "$badge" != *"name='com.google.android.apps.messaging'"* || "$badge" == *"split='"* ]]; then
            echo "::error::Unexpected package identity or split APK"
            exit 1
          fi
          # apksigner may list v3.0 and v3.1 rotated signers. Require at
          # least one verified APK signer (not the source stamp) to match a
          # pinned Google Messages certificate.
          signer_info="$("$signer" verify --print-certs "$apk")"
          signer_digests="$(printf '%s\n' "$signer_info" |
            awk 'tolower($0) ~ /v[0-9.]+ signer:.*certificate sha-256 digest:/ {print tolower($NF)}')"
          echo "Verified APK signer fingerprints (Google key rotation supported):"
          printf '%s\n' "$signer_digests"
          if ! printf '%s\n' "$signer_digests" | grep -Fxq "$expected_cert" &&
             ! printf '%s\n' "$signer_digests" | grep -Fxq "$expected_cert_alt"; then
            echo "::error::None of the APK signers matches our trusted Google Messages certificates"
            exit 1
          fi
          echo "Verified Google Messages APK package and signing certificate."

          apktool d -f "$apk" -o "$RUNNER_TEMP/synack-mms-decompiled"

          source_dirs=("$RUNNER_TEMP/synack-mms-decompiled/res"/xml-mcc*)
          if [[ "${#source_dirs[@]}" -eq 0 ]] || ! find "${source_dirs[@]}" -type f -name mms_config.xml -print -quit | grep -q .; then
            echo "::error::No carrier MMS config files extracted; existing configs left untouched"
            exit 1
          fi

          rm -rf android-smsmms/src/main/res/xml-mcc*
          cp -rv "${source_dirs[@]}" android-smsmms/src/main/res/
          find android-smsmms/src/main/res/xml-mcc* -name '*_config_override.xml' -print -delete

      - name: Remove Duplicate MMS Config Files
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen
          for file in android-smsmms/src/main/res/xml-mcc*/mms_config.xml; do
            dir_name=$(dirname "$file")
            if [[ "$dir_name" == *-mnc00 ]]; then
              # Check for corresponding directory without -mnc suffix
              base_dir=$(echo "$dir_name" | sed 's/-mnc00//')
              if [[ -d "$base_dir" ]]; then
                echo "Duplicate found for $base_dir and $dir_name"
                rm -rf "$base_dir"
              fi
            fi
          done
          
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mms): Update MMS configs from Google Messages"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update MMS configs"
          body: |
            Manually requested one-time extraction of carrier MMS configs from Google Messages.

            Review these carrier configuration changes before merging. There is no
            scheduled refresh, no on-device Google APK downloader, and no automatic merge.

            Source workflow: .github/workflows/synack-mms-import.yml
          add-paths: android-smsmms/src/main/res/xml-mcc*
          branch: ${{ env.NEW_BRANCH }}
          base: master
          labels: automated, area:mms
