name: SynAck SMS - One-Time MMS Config Refresh

on:
  workflow_dispatch:
    inputs:
      refresh_mms_configs:
        description: 'Run ONE manual MMS config refresh from Google Messages and open a review PR?'
        required: true
        type: boolean
        default: false
  # Temporary one-time push trigger. The job executes ONLY for the exact request commit.
  # This trigger will be removed after the import run.
  push:
    branches: [master]
    paths: ['.github/workflows/synack-mms-import.yml']

concurrency:
  group: one-time-mms-configs
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh_mms_configs == true) || (github.event_name == 'push' && github.event.head_commit.message == 'ci: request one-time MMS config import') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      APKEEP_VERSION: 1.0.0
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-apkeep-${{ env.APKEEP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-apkeep-
      
      - name: Set Branch Name
        run: echo "NEW_BRANCH=update-mms-configs-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
      
      - name: Install apkeep
        shell: bash
        run: |
          set -euo pipefail
          if command -v apkeep >/dev/null 2>&1; then
            installed_version=$(apkeep --version | awk '{print $2}')
            if [[ "$installed_version" == "$APKEEP_VERSION" ]]; then
              echo "apkeep ${APKEEP_VERSION} already installed."
              exit 0
            fi
          fi
          cargo install apkeep --locked --version "$APKEEP_VERSION"
        
      - name: Install APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt apktool unzip
          
      - name: Download Google Messages APK to temporary runner folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/synack-mms-apk"
          apkeep -a com.google.android.apps.messaging "$RUNNER_TEMP/synack-mms-apk"
          find "$RUNNER_TEMP/synack-mms-apk" -maxdepth 2 -type f -printf '%p\n'

      - name: Extract MMS config resources (no APK checked into repo)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          download_dir="$RUNNER_TEMP/synack-mms-apk"
          for archive in "$download_dir"/*.xapk; do
            unzip -oq "$archive" -d "$download_dir/extracted"
          done
          apk="$download_dir/com.google.android.apps.messaging.apk"
          if [[ ! -f "$apk" ]]; then
            apk="$(find "$download_dir" -type f -name base.apk -print -quit)"
          fi
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            apk="$(find "$download_dir" -type f -name '*.apk' -print -quit)"
          fi
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "::error::No APK found from Google Messages download"
            exit 1
          fi

          apktool d -f "$apk" -o "$RUNNER_TEMP/synack-mms-decompiled"

          source_dirs=("$RUNNER_TEMP/synack-mms-decompiled/res"/xml-mcc*)
          if [[ "${#source_dirs[@]}" -eq 0 ]] || ! find "${source_dirs[@]}" -type f -name mms_config.xml -print -quit | grep -q .; then
            echo "::error::No carrier MMS config files extracted; existing configs left untouched"
            exit 1
          fi

          rm -rf android-smsmms/src/main/res/xml-mcc*
          cp -rv "${source_dirs[@]}" android-smsmms/src/main/res/
          find android-smsmms/src/main/res/xml-mcc* -name '*_config_override.xml' -print -delete

      - name: Remove Duplicate MMS Config Files
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen
          for file in android-smsmms/src/main/res/xml-mcc*/mms_config.xml; do
            dir_name=$(dirname "$file")
            if [[ "$dir_name" == *-mnc00 ]]; then
              # Check for corresponding directory without -mnc suffix
              base_dir=$(echo "$dir_name" | sed 's/-mnc00//')
              if [[ -d "$base_dir" ]]; then
                echo "Duplicate found for $base_dir and $dir_name"
                rm -rf "$base_dir"
              fi
            fi
          done
          
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(mms): Update MMS configs from Google Messages"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "Update MMS configs"
          body: |
            Manually requested one-time extraction of carrier MMS configs from Google Messages.

            Review these carrier configuration changes before merging. There is no
            scheduled refresh, no on-device Google APK downloader, and no automatic merge.

            Source workflow: .github/workflows/synack-mms-import.yml
          add-paths: android-smsmms/src/main/res/xml-mcc*
          branch: ${{ env.NEW_BRANCH }}
          base: master
          labels: automated, area:mms
